<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merkbuch</title>
<meta name="theme-color" content="#A8275F">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F0F7; --surface:#FFFFFF; --ink:#241A2E; --muted:#6B6078; --line:#DDD7E6;
  --accent:#A8275F; --accent-ink:#FFFFFF; --chip:#E9E4F1; --warn:#8A5A00; --warn-bg:#FFF1CC;
  --display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17121D; --surface:#221A2B; --ink:#EFE9F5; --muted:#A99DB8; --line:#3A2F47;
    --accent:#F07AA8; --accent-ink:#2A0F1C; --chip:#30263C; --warn:#FFD98A; --warn-bg:#3D2F10;
  }
}
:root[data-theme="dark"]{
  --bg:#17121D; --surface:#221A2B; --ink:#EFE9F5; --muted:#A99DB8; --line:#3A2F47;
  --accent:#F07AA8; --accent-ink:#2A0F1C; --chip:#30263C; --warn:#FFD98A; --warn-bg:#3D2F10;
}
*,*::before,*::after{box-sizing:inherit}
details > *{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{max-width:640px;margin:0 auto;padding:20px 16px 160px}
h1{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.1;margin:4px 0 16px;letter-spacing:-0.01em}
h2{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:28px 0 10px}
h3{font-family:var(--display);font-weight:500;font-size:1.1rem;margin:0 0 8px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.9rem}

.field{width:100%;min-height:48px;padding:11px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px}
textarea.field{display:block;resize:none;overflow:hidden;min-height:48px}
select.field{appearance:auto}
.row{display:flex;gap:8px;align-items:stretch}
.row > .field{flex:1;min-width:0}

.btn{min-height:48px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent);padding:10px 8px}
.btn.danger{color:#C0263B;background:transparent}
:root[data-theme="dark"] .btn.danger{color:#FF8A98}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.danger{color:#FF8A98}}
.btn.icon{width:48px;padding:0;flex:none}
.btn:disabled{opacity:.4;cursor:default}

.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}

/* Personenliste */
.people{list-style:none;margin:16px 0 0;padding:0}
.person{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:1.2rem}
img.avatar{object-fit:cover;display:block}
.avatar.big{width:64px;height:64px;font-size:1.7rem}
.personhead{align-items:center;gap:12px;margin-bottom:6px}
.personhead .namefield{margin-bottom:0}
.photobtn{flex:none;padding:0;border:0;border-radius:50%;background:none;cursor:pointer}
.photopreview{display:flex;justify-content:center;margin-bottom:16px}
.photopreview .avatar{width:120px;height:120px;font-size:3rem}
dialog .stack{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
dialog .stack .btn{white-space:normal}
.person .name{font-weight:600;display:block;overflow-wrap:anywhere}
.person .meta{display:block;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.person .hit b{color:var(--ink);font-weight:600}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px 16px;color:var(--muted);text-align:center;margin-top:16px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--chip);cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"]::before{content:"✓ "}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--chip);font-size:.9rem;font-weight:500;margin:0 6px 6px 0}

/* Detail */
.topbar{display:flex;align-items:center;justify-content:space-between;margin:-6px -8px 6px}
.namefield{font-family:var(--display);font-weight:700;font-size:1.6rem;margin-bottom:6px}

/* Vergleich */
.result{padding:12px 0;border-top:1.5px solid var(--line)}
.result:first-child{border-top:0;padding-top:0}
.cmphead{font-family:var(--display);font-weight:700;font-size:1.1rem;margin:22px 0 8px;overflow-wrap:anywhere}
.btn.icon{display:inline-grid;place-items:center}
.catcard{padding:10px}
.catcard > .row .field{min-height:44px;padding:8px 12px}
.catcard > .row .btn.icon{width:44px;min-height:44px}
.catcard.off{background:transparent;border-style:dashed}
.catcard.off > .row > .field{color:var(--muted);text-decoration:line-through;background:transparent}
.morebtn{min-height:36px;margin:4px 0 0 -4px;padding:4px 8px;font-size:.9rem}
.catbody{margin-top:8px}
.catcard{-webkit-touch-callout:none}
.catcard.dragging{position:relative;z-index:3;border-color:var(--accent);box-shadow:0 10px 26px rgba(20,10,30,.32)}
body.sorting{-webkit-user-select:none;user-select:none}
.catline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.addslot{margin:14px 0 4px}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;
  width:56px;height:56px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgba(20,10,30,.3)}
.fab svg{width:26px;height:26px}
.vcard{margin-top:10px}
.extrarow{display:flex;gap:6px;margin-bottom:12px}
.extrarow .field{min-width:0;margin-bottom:0}
.extrarow .lab{flex:2}
.extrarow .val{flex:3}
.extrarow .btn{flex:none;width:44px;min-height:44px}
.addfield{min-height:40px;width:44px;margin:-4px 0 0 -8px;font-size:1.3rem;line-height:1}
.maplink{display:inline-block;margin:-4px 0 12px;min-height:32px;color:var(--accent);font-weight:600;font-size:.95rem}
.lock{max-width:320px;margin:16vh auto 0;text-align:center}
.lock .field{margin-bottom:12px;text-align:center;font-size:1.4rem;letter-spacing:.3em}
.lock .btn{width:100%;margin-top:8px;white-space:normal}
.lock form .btn{margin-top:0}
.cnlist{list-style:none;margin:0 0 14px;padding:0;max-height:46vh;overflow:auto;border:1.5px solid var(--line);border-radius:12px}
.cnlist li{border-top:1.5px solid var(--line)}
.cnlist li:first-child{border-top:0}
.cnlist label{display:flex;gap:10px;align-items:center;margin:0;padding:10px 12px;font-weight:400;cursor:pointer}
.cnlist input{flex:none;width:22px;height:22px;accent-color:var(--accent)}
.cnlist .cnname{font-weight:600;display:block;overflow-wrap:anywhere}
.cnlist .cnmeta{display:block;font-size:.85rem;color:var(--muted)}
.recopt{border-top:1.5px solid var(--line);padding:12px 0}
.recopt strong{display:block;margin-bottom:2px}
.recopt .state{display:block;margin-bottom:8px;font-size:.9rem;color:var(--muted)}
.recopt .row{flex-wrap:wrap}
.codebox{margin:0 0 14px;padding:14px 10px;border-radius:12px;background:var(--chip);text-align:center;font-size:1.3rem;font-weight:700;letter-spacing:.08em;overflow-wrap:anywhere}
.hintbox{padding:10px 12px;border-radius:12px;background:var(--chip)}
.fold label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
.fold .field{margin-bottom:12px}
/* Abschnitte der Einstellungen als Karten wie in der Personenliste: Titel, darunter die Kurzfassung, rechts der Pfeil */
.setcard{padding:0;overflow:hidden;margin-bottom:10px}
.setcard > h2{margin:0;font-size:1.1rem;font-weight:500}
.h2btn{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;row-gap:2px;width:100%;min-height:60px;padding:12px 14px;border:0;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.h2btn > span:first-child{grid-column:2;grid-row:1 / span 2;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--accent);font-size:.8rem}
.h2btn > span:nth-child(2){grid-column:1;grid-row:1}
.h2btn .now{grid-column:1;grid-row:2;font-family:var(--body);font-weight:400;font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.h2btn .now:empty{display:none}
.h2btn[aria-expanded="true"] > span:first-child{background:var(--accent);color:var(--accent-ink)}
.setcard > h2 + div{padding:14px;border-top:1.5px solid var(--line)}
.setcard .catcard{background:var(--bg);border-color:transparent}
.setcard .catcard.off{background:transparent;border:1.5px dashed var(--line)}
.setcard .recopt:last-child{padding-bottom:0}
.swatch{display:inline-block;width:14px;height:14px;margin-right:8px;border-radius:50%;vertical-align:-2px;border:1.5px solid rgba(255,255,255,.75)}
.chipnote{align-self:center}
.chip.morechip{min-width:44px;background:transparent;border-style:dashed;color:var(--accent);font-weight:700}
.cmpsearch{margin-bottom:10px}
.vcard h3{margin-bottom:14px}
.personhead .btn.icon{display:grid;place-items:center}
.personhead .btn[aria-expanded="true"]{background:var(--chip)}
.actions.end{justify-content:flex-end}
.settingshead{display:flex;align-items:center;gap:8px}
.tagoff{flex:none;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:.8rem;font-weight:600}
.vcard label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
.vcard .field{margin-bottom:12px}
.vcard .field:last-child{margin-bottom:0}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);padding:0;overflow-x:auto;overscroll-behavior-x:contain}
.cols .result{min-width:0;padding:14px;border-top:0;border-left:1.5px solid var(--line)}
.cols .result:first-child{padding-top:14px;border-left:0}
.cols > p{padding:14px}
.result .who{font-weight:600;margin-bottom:4px}
.result .text{white-space:pre-wrap;overflow-wrap:anywhere}

/* Kategorien verwalten */
.subrow{display:flex;gap:8px;margin-top:8px}
.subrow .field{min-height:44px;padding:8px 12px}
.subrow .btn{min-height:44px}
.subrow .btn.icon{width:44px}
.indent{margin-left:14px;padding-left:12px;border-left:3px solid var(--chip)}

.rank{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.rankhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ranknum{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.rankname{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.rankhead .btn{min-height:44px;width:44px}
.ranklist{margin:0;padding-left:24px}
.ranklist li{margin-bottom:6px;overflow-wrap:anywhere}
.ranklist li b{font-weight:600}
.check{display:flex;gap:10px;align-items:center;min-height:44px;margin-top:10px;cursor:pointer}
.check input{flex:none;width:22px;height:22px;accent-color:var(--accent)}

.cardhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cardhead h3{margin:0;min-width:0;overflow-wrap:anywhere}
.cardhead .btn{min-height:44px;width:44px;padding:0;display:grid;place-items:center}
.btn svg{display:block;width:22px;height:22px}
.actions .btn{display:grid;place-items:center}
.actions .row{flex:none}
.points{list-style:none;margin:0;padding:0}
.point{display:flex;align-items:stretch;gap:6px;margin-bottom:8px}
.pointbody{flex:1;min-width:0;background:var(--chip);border-radius:12px;padding:2px 4px}
.pointtext{display:block;width:100%;min-height:44px;padding:10px;background:none;border:0;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.pointtitle{display:block;font-weight:600}
.pointdesc{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;margin-top:2px;font-size:.9rem;color:var(--muted)}
.point.given .pointbody{background:transparent;border:1.5px dashed var(--line)}
.pointgiven{display:block;margin-top:2px;font-size:.85rem;font-weight:600;color:var(--accent)}
.archive{margin-top:6px}
.archive .points{margin-top:6px}
.pointmeta{display:block;margin-top:2px;font-size:.85rem;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 12px}
.thumbs:empty{display:none}
.thumbwrap{position:relative}
.thumb{display:block;width:100%;aspect-ratio:1;padding:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--chip);cursor:pointer}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb img:not([src]){visibility:hidden}
.thumbx{position:absolute;top:-8px;right:-8px;width:32px;height:32px;padding:0;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:#C0263B;font-weight:700;cursor:pointer}
.addimg{margin-bottom:14px}
dialog.viewer{padding:12px;max-width:min(96vw,640px)}
.viewer img{display:block;max-width:100%;max-height:70vh;margin:0 auto 12px;border-radius:10px}
.readdesc{display:block;font-size:.9rem;color:var(--muted);white-space:pre-wrap}
.pointlink{display:inline-block;padding:0 10px 10px;color:var(--accent);font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.point .btn{min-height:44px;width:44px}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.suggest .chip{min-height:40px;padding:4px 12px;font-size:.95rem;background:var(--surface)}
.readpoints{margin:4px 0 0;padding-left:20px}
.readpoints li{margin-bottom:4px;overflow-wrap:anywhere}
.readpoints a,.ranklist a{color:var(--accent);font-weight:600}
.readpoints a{display:block;width:fit-content;font-size:.9rem}
.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.actions p{margin:0}
dialog label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
dialog .field{margin-bottom:14px}
dialog textarea.field{overflow:auto;resize:vertical}

.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:.95rem}
.banner .btn{min-height:36px;padding:2px 0;color:inherit;text-decoration:underline;font-size:inherit}

/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .inner{max-width:640px;margin:0 auto;display:flex}
nav button{flex:1;min-height:60px;background:none;border:0;cursor:pointer;color:var(--muted);font-weight:600;font-size:.95rem;border-top:3px solid transparent;margin-top:-1.5px}
nav button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}

/* Dialog + Hinweis */
dialog{border:0;border-radius:18px;padding:20px;max-width:min(92vw,420px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(20,10,30,.55)}
dialog p{margin-bottom:18px}
dialog .row{justify-content:flex-end;flex-wrap:wrap}
dialog .row .btn{white-space:normal}
.toast{position:fixed;left:50%;bottom:calc(146px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.95rem;z-index:10;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav aria-label="Bereiche">
  <div class="inner">
    <button data-view="people">Personen</button>
    <button data-view="compare">Vergleichen</button>
    <button data-view="settings">Einstellungen</button>
  </div>
</nav>

<dialog id="dlg">
  <p id="dlgText"></p>
  <div class="row">
    <button class="btn" id="dlgNo">Abbrechen</button>
    <button class="btn primary" id="dlgYes">OK</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";

/* ---------- Daten ---------- */
var KEY = "merkbuch.v1";
var APP_VERSION = "12.10.2026 (2)";   // steht unten in den Einstellungen; zeigt, ob ein Update angekommen ist
var STANDALONE = !(window.claude && typeof window.claude.use === "function");   // als eigene App, nicht innerhalb von Claude

/* Merkt sich, wann zuletzt ein Backup gespeichert wurde, und seit wann die App benutzt wird */
var BACKUP_KEY = "merkbuch.lastBackup", FIRST_KEY = "merkbuch.firstUse";
function readDate(key){ try { var t = Number(localStorage.getItem(key)); return t > 0 ? t : 0; } catch (e) { return 0; } }
function markBackup(){ try { localStorage.setItem(BACKUP_KEY, String(Date.now())); } catch (e) {} }
try { if (!localStorage.getItem(FIRST_KEY)) localStorage.setItem(FIRST_KEY, String(Date.now())); } catch (e) {}
function daysSinceBackup(){
  var since = readDate(BACKUP_KEY) || readDate(FIRST_KEY);
  return since ? Math.floor((Date.now() - since) / 86400000) : 0;
}
// Bittet den Browser, die Daten dauerhaft zu behalten (wird bei installierten Apps in der Regel gewährt)
try { if (STANDALONE && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}); } catch (e) {}

/* Datei über den Browser herunterladen (außerhalb von Claude) */
function browserDownload(filename, text){
  try {
    var url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    var a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    return true;
  } catch (e) { return false; }
}

/* Weitere Einstellungen, je Gerät gespeichert */
var PREFS_KEY = "merkbuch.prefs";
function defaultPrefs(){ return { startEdit: false, sort: "name", suggest: true, remind: 30, cmpCats: null, cmpPeople: 5 }; }
var prefs = defaultPrefs();
try {
  var savedPrefs = JSON.parse(localStorage.getItem(PREFS_KEY) || "null");
  if (savedPrefs && typeof savedPrefs === "object") {
    prefs.startEdit = !!savedPrefs.startEdit;
    if (/^(name|recent|birthday)$/.test(savedPrefs.sort)) prefs.sort = savedPrefs.sort;
    prefs.suggest = savedPrefs.suggest !== false;
    if ([0, 7, 30, 90].indexOf(Number(savedPrefs.remind)) !== -1) prefs.remind = Number(savedPrefs.remind);
    if (Array.isArray(savedPrefs.cmpCats)) prefs.cmpCats = savedPrefs.cmpCats.map(String);
    if ([3, 5, 8, 10].indexOf(Number(savedPrefs.cmpPeople)) !== -1) prefs.cmpPeople = Number(savedPrefs.cmpPeople);
  }
} catch (e) {}
function setPref(key, value){
  prefs[key] = value;
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {}
}

var DESIGN_KEY = "merkbuch.design";
var DESIGN_VARS = ["accent", "accent-ink", "bg", "surface", "chip", "line"];
var THEMES = {
  beere:   { label: "Beere",   swatch: "#A8275F" },
  blau:    { label: "Blau",    swatch: "#1D5FC2",
    light: { accent: "#1D5FC2", bg: "#EEF2F8", chip: "#E0E8F4", line: "#D2DCEA" },
    dark:  { accent: "#86B4FF", "accent-ink": "#0A1E3D", bg: "#10151C", surface: "#19212C", chip: "#24303F", line: "#2F3E52" } },

/* Notizen sind einzelne Punkte { id, title, desc, url }. Ältere Stände (Freitext oder nur Text) werden zerlegt. */
function toPoints(v){
  var out = [];
  function add(pt, id, src){
    if (!pt.title && pt.desc) { pt.title = pt.desc; pt.desc = ""; }
    var imgs = src && Array.isArray(src.imgs) ? src.imgs.map(String).slice(0, MAX_IMGS) : [];
    if (!pt.title) return;
    var point = { id: id || uid(), title: pt.title, desc: pt.desc, url: pt.url, imgs: imgs };
    if (src && src.given) {   // liegt im Geschenkarchiv
      point.given = true;
      point.givenNote = String(src.givenNote || "").trim().slice(0, 300);
      point.givenAt = /^\d{4}-\d{2}-\d{2}$/.test(String(src.givenAt || "")) ? src.givenAt : "";
    }
    out.push(point);
  }
  if (Array.isArray(v)) {
    v.forEach(function(n){
      if (!n || typeof n !== "object") return;
      var link = safeUrl(String(n.url || "")) || "";
      var id = n.id ? String(n.id) : "";
      if (typeof n.title === "string" || typeof n.desc === "string") {
        add({ title: String(n.title || "").trim(), desc: String(n.desc || "").trim(), url: link }, id, n);
      } else {
        var pt = parsePoint(String(n.text || ""));
        if (link) pt.url = link;
        add(pt, id, n);
      }
    });
  } else if (typeof v === "string") {
    v.split(/\n+/).forEach(function(line){ add(parsePoint(line)); });
  }
  return out;
}
/* Zerlegt eine Eingabe in Titel, Beschreibung und Link.
   Getrennt wird am ersten Doppelpunkt (mit Leerzeichen danach) oder an einem frei stehenden Bindestrich;
   eine enthaltene Internetadresse wird als Link übernommen. */
function parsePoint(raw){
  raw = String(raw || "");
  var url = "";
  var m = raw.match(/(?:https?:\/\/|www\.)\S+/i);
  if (m) {
    var u = safeUrl(m[0].replace(/[),.;!?]+$/, ""));
    if (u) { url = u; raw = raw.replace(m[0], " "); }
  }
  raw = raw.replace(/\s+/g, " ").trim();
  var title = raw, desc = "";
  var sep = raw.match(/:\s|\s[-–—]\s/);
  if (sep) {
    title = raw.slice(0, sep.index).trim();
    desc = raw.slice(sep.index + sep[0].length).trim();
  }
  title = title.replace(/[:\s–—-]+$/, "").trim() || title;
  if (!title && desc) { title = desc; desc = ""; }
  if (!title && url) { try { title = new URL(url).hostname.replace(/^www\./, ""); } catch (e) {} }
  return { title: title, desc: desc, url: url };
}
/* Gibt eine aufrufbare http(s)-Adresse zurück, "" für leer und null für ungültig. */
function safeUrl(v){
  v = String(v || "").trim();
  if (!v) return "";
  if (!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = "https://" + v;
  try {
    var u = new URL(v);
    if ((u.protocol === "http:" || u.protocol === "https:") && u.hostname.indexOf(".") !== -1) return u.href;
  } catch (e) {}
  return null;
}

var CARD_FIELDS = [["birthday", "Geburtsdatum", "date"], ["partner", "PartnerIn", "text"], ["kids", "Kinder", "text"], ["phone", "Telefon", "tel"],
  ["email", "E-Mail", "email"], ["address", "Adresse", "area"], ["other", "Sonstiges", "area"]];
function cleanCard(c){
  var out = {};
  CARD_FIELDS.forEach(function(f){
    var v = c && typeof c === "object" ? String(c[f[0]] || "") : "";
    if (f[2] === "date" && !/^\d{4}-\d{2}-\d{2}$/.test(v)) v = "";
    out[f[0]] = v.slice(0, 2000);
  });
  // selbst ergänzte Felder: Bezeichnung + Angabe
  out.extra = [];
  (c && Array.isArray(c.extra) ? c.extra : []).forEach(function(x){
    if (!x || typeof x !== "object") return;
    var label = String(x.label || "").slice(0, 200), value = String(x.value || "").slice(0, 2000);
    if (label.trim() || value.trim()) out.extra.push({ id: String(x.id || uid()), label: label, value: value });
  });
  return out;
}
function cardOf(p){ if (!p.card) p.card = cleanCard(null); return p.card; }
function cardLines(p){
  var c = p.card || {}, lines = [];
  CARD_FIELDS.forEach(function(f){
    var v = String(c[f[0]] || "").trim();
    if (!v) return;
    if (f[2] === "date") v = v.slice(8, 10) + "." + v.slice(5, 7) + "." + v.slice(0, 4);
    lines.push(f[1] + ": " + v.replace(/\s*\n\s*/g, ", "));
  });
  (c.extra || []).forEach(function(x){
    var label = String(x.label || "").trim(), value = String(x.value || "").trim();
    if (value) lines.push((label || "Weiteres") + ": " + value); else if (label) lines.push(label);
  });
  return lines;
}

  data.categories.forEach(function(c){
    if (!c || typeof c !== "object") return;
    var subs = [];
    (Array.isArray(c.subs) ? c.subs : []).forEach(function(s){
      if (s && typeof s === "object") subs.push({ id: String(s.id || uid()), name: String(s.name || "") });
    });
    cats.push({ id: String(c.id || uid()), name: String(c.name || ""), kind: String(c.kind || ""), ranked: !!c.ranked, detail: !!(c.detail || c.ranked), hidden: !!c.hidden, subs: subs });
  });
  var people = [];
  data.people.forEach(function(p){
    if (!p || typeof p !== "object") return;
    var entries = {};
    var src = (p.entries && typeof p.entries === "object") ? p.entries : {};
    Object.keys(src).forEach(function(catId){
      var e = src[catId];
      if (!e || typeof e !== "object") return;
      var notes = {};
      if (e.subNotes && typeof e.subNotes === "object") Object.keys(e.subNotes).forEach(function(k){ notes[k] = toPoints(e.subNotes[k]); });
      entries[catId] = {
        notes: toPoints(e.notes !== undefined ? e.notes : e.text),
        subs: (Array.isArray(e.subs) ? e.subs : []).map(String),
        subNotes: notes
      };
    });
    people.push({ id: String(p.id || uid()), name: String(p.name || ""), photo: validPhoto(p.photo) ? p.photo : "", card: cleanCard(p.card), updated: Number(p.updated) || 0, seen: Number(p.seen) || 0, entries: entries });
  });

}

/* Bringt ältere Datenstände auf den aktuellen Stand, ohne Einträge zu verlieren. */
function migrate(s){
  if (s.version < 2) {
    function same(a, b){ return a.trim().toLowerCase() === b.toLowerCase(); }
    var sweets = s.categories.filter(function(c){ return same(c.name, "Süßigkeiten"); })[0];
    if (sweets) {
      sweets.ranked = true;
      var wanted = ["Schokolade", "Chips", "Kekse", "Fruchtgummi"];
      var ordered = wanted.map(function(w){
        return sweets.subs.filter(function(x){ return same(x.name, w); })[0] || { id: uid(), name: w };
      });
      sweets.subs.forEach(function(x){
        if (ordered.indexOf(x) !== -1) return;
        var used = s.people.some(function(p){ var e = p.entries[sweets.id]; return !!e && e.subs.indexOf(x.id) !== -1; });
        if (same(x.name, "Lakritz") && !used) return;   // alter Vorschlag, nirgends angekreuzt
        ordered.push(x);
      });
      sweets.subs = ordered;
    }
    if (!s.categories.some(function(c){ return same(c.name, "Ernährung"); })) {
      s.categories.push({ id: uid(), name: "Ernährung", ranked: false,
        subs: ["Vegetarisch", "Vegan", "Sonstiges"].map(function(n){ return { id: uid(), name: n }; }) });
    }
    s.version = 2;
  }
  if (s.version < 3) {
    // Ernährung steht ganz oben
    var idx = -1;
    s.categories.forEach(function(c, i){ if (idx === -1 && c.name.trim().toLowerCase() === "ernährung") idx = i; });
    if (idx > 0) s.categories.unshift(s.categories.splice(idx, 1)[0]);
    s.version = 3;
  }
  if (s.version < 5) s.version = 5;   // Notizen als Punkte mit Titel, Beschreibung und Link: die Umwandlung passiert beim Einlesen
  if (s.version < 6) {
    // Wortvorschläge: Kategorien merken sich ihre Wortliste, auch wenn sie später umbenannt werden
    s.categories.forEach(function(c){ if (!c.kind) c.kind = KIND_BY_NAME[c.name.trim().toLowerCase()] || ""; });
    s.version = 6;
  }
  if (s.version < 7) {
    // PartnerIn steht jetzt in der Visitenkarte: vorhandene Einträge dorthin übernehmen, Kategorie entfernen
    s.categories.filter(function(c){ return c.kind === "partner"; }).forEach(function(pc){
      s.people.forEach(function(p){
        var e = p.entries[pc.id];
        if (!e) return;
        var texts = (e.notes || []).map(function(n){ return noteLabel(n) + (n.url ? " (" + n.url + ")" : ""); });
        if (!p.card) p.card = cleanCard(null);
        if (texts.length) p.card.partner = [p.card.partner].concat(texts).filter(Boolean).join(", ");
        delete p.entries[pc.id];
      });
    });
    s.categories = s.categories.filter(function(c){ return c.kind !== "partner"; });
    // neue Standardkategorien ergänzen und alles in die neue Reihenfolge bringen: Getränke, Essen, Weiteres, dann eigene
    var order = {};
    DEFAULT_CATS.forEach(function(d, i){
      var kind = KIND_BY_NAME[d[0].toLowerCase()];
      order[kind] = i;
      if (!s.categories.some(function(c){ return c.kind === kind || c.name.trim().toLowerCase() === d[0].toLowerCase(); })) s.categories.push(makeCat(d));
    });
    s.categories = s.categories.map(function(c, i){ return { c: c, k: order[c.kind] !== undefined ? order[c.kind] : 1000 + i }; })
      .sort(function(a, b){ return a.k - b.k; }).map(function(x){ return x.c; });
    s.version = 7;
  }
  if (s.version < 8) {
    // Kaffee und Tee werden eine Kategorie; Kaffee ist dort eine Unterkategorie
    var tea = s.categories.filter(function(c){ return c.kind === "tee"; })[0];
    var cof = s.categories.filter(function(c){ return c.kind === "kaffee"; })[0];
    if (!tea && cof) {
      cof.kind = "tee";
      if (cof.name.trim() === "Kaffee") cof.name = "Kaffee & Tee";
    } else if (tea) {
      if (tea.name.trim() === "Tee") tea.name = "Kaffee & Tee";
      var ksub = tea.subs.filter(function(x){ return x.name.trim().toLowerCase() === "kaffee"; })[0];
      if (!ksub) { ksub = { id: uid(), name: "Kaffee" }; tea.subs.unshift(ksub); }
      if (cof) {
        s.people.forEach(function(p){
          var ce = p.entries[cof.id];
          if (!ce) return;
          var picked = cof.subs.filter(function(x){ return ce.subs.indexOf(x.id) !== -1; }).map(function(x){ return x.name; });
          var notes = (ce.notes || []).slice();
          if (picked.length) notes.unshift({ id: uid(), title: "Kaffee", desc: picked.join(", "), url: "", imgs: [] });
          if (notes.length) {
            var te = p.entries[tea.id] || (p.entries[tea.id] = { notes: [], subs: [], subNotes: {} });
            if (te.subs.indexOf(ksub.id) === -1) te.subs.push(ksub.id);
            te.notes = (te.notes || []).concat(notes);
          }
          delete p.entries[cof.id];
        });
        var at = s.categories.indexOf(cof);
        s.categories = s.categories.filter(function(c){ return c !== cof && c !== tea; });
        s.categories.splice(Math.min(at, s.categories.length), 0, tea);
      }
    }
    s.version = 8;
  }
  if (s.version < 9) {
    // Die später ergänzten Kategorien sind zunächst ausgeblendet, außer es steht schon etwas darin
    s.categories.forEach(function(c){
      if (!HIDDEN_KINDS[c.kind] || c.hidden) return;
      var used = s.people.some(function(p){
        var e = p.entries[c.id];
        return !!e && ((e.subs || []).length > 0 || (e.notes || []).length > 0 ||
          Object.keys(e.subNotes || {}).some(function(k){ return e.subNotes[k].length > 0; }));
      });
      if (!used) c.hidden = true;
    });
    s.version = 9;
  }
  if (s.version < 10) {
    s.categories.forEach(function(c){
      if (c.kind === "ernaehrung") {
        // „Sonstiges“ entfällt; dafür gibt es die Notizen
        var gone = c.subs.filter(function(x){ return x.name.trim().toLowerCase() === "sonstiges"; });
        gone.forEach(function(g){
          s.people.forEach(function(p){
            var e = p.entries[c.id];
            if (!e) return;
            e.subs = (e.subs || []).filter(function(id){ return id !== g.id; });
            if (e.subNotes) delete e.subNotes[g.id];
          });
        });
        c.subs = c.subs.filter(function(x){ return gone.indexOf(x) === -1; });
      }
      if (c.kind === "tee") c.detail = true;                                   // Auswahl über + mit eigenen Notizen, ohne Rangfolge
      if (c.kind === "cocktails" && c.name.trim() === "Cocktails") c.name = "Getränke";
    });
    s.version = 10;
  }
  if (s.version < 11) {
    // neue Reihenfolge; Lieblingsessen gehört jetzt zu den eingeblendeten Kategorien
    var rank = {};
    DEFAULT_CATS.forEach(function(d, i){ rank[KIND_BY_NAME[d[0].toLowerCase()]] = i; });
    s.categories.forEach(function(c){
      if (c.kind === "essen") c.hidden = false;
      if (c.kind === "tee" && c.name.trim() === "Kaffee & Tee") c.name = "Tee & Kaffee";
    });
    s.categories = s.categories.map(function(c, i){ return { c: c, k: rank[c.kind] !== undefined ? rank[c.kind] : 1000 + i }; })
      .sort(function(a, b){ return a.k - b.k; }).map(function(x){ return x.c; });
    s.version = 11;
  }
  return s;
}

function h(tag, attrs){
  var node = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.slice(0,2) === "on") node.addEventListener(k.slice(2), v);
    else if (k === "value") node.value = v;
    else if (k === "icon") node.innerHTML = v;   // nur für die festen Symbole unten
    else node.setAttribute(k, v === true ? "" : v);
  });
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c === null || c === undefined || c === false) continue;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return node;
}

/* Tage bis zum nächsten Geburtstag (0 = heute), null ohne Geburtsdatum */
function daysToBirthday(p){
  var b = p.card && p.card.birthday;
  if (!b) return null;
  var now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var next = new Date(today.getFullYear(), Number(b.slice(5, 7)) - 1, Number(b.slice(8, 10)));
  if (next < today) next = new Date(today.getFullYear() + 1, Number(b.slice(5, 7)) - 1, Number(b.slice(8, 10)));
  return Math.round((next - today) / 86400000);
}
function birthdayText(p){
  var d = daysToBirthday(p), b = p.card.birthday;
  return "Geburtstag am " + b.slice(8, 10) + "." + b.slice(5, 7) + "., " + (d === 0 ? "heute" : d === 1 ? "morgen" : "in " + d + " Tagen");
}
function sortedPeople(){
  var list = state.people.slice();
  if (prefs.sort === "recent") return list.sort(function(a, b){
    return Math.max(b.seen || 0, b.updated || 0) - Math.max(a.seen || 0, a.updated || 0) || byName(a, b);
  });
  if (prefs.sort === "birthday") return list.sort(function(a, b){
    var x = daysToBirthday(a), y = daysToBirthday(b);
    return (x === null ? 1e6 : x) - (y === null ? 1e6 : y) || byName(a, b);
  });
  return list.sort(byName);
}

/* Verkleinert ein gewähltes Bild auf ein quadratisches Foto (Ausschnitt aus der Mitte) */
function shrinkPhoto(file){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      try {
        var side = Math.min(img.naturalWidth, img.naturalHeight), size = 256;
        var canvas = document.createElement("canvas");
        canvas.width = canvas.height = size;
        canvas.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
        var data = canvas.toDataURL("image/jpeg", 0.82);
        URL.revokeObjectURL(url);
        if (validPhoto(data)) resolve(data); else reject(new Error("Bild"));
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("Bild")); };
    img.src = url;
  });
}

/* Was bei einer Person in einer Kategorie steht: Auswahl (bei Rangfolge sortiert, mit Notizen) + Notizen */
function entryOf(person, cat){
  var e = person.entries[cat.id];
  var items = [];
  if (e) {
    if (cat.ranked) {
      e.subs.forEach(function(id){
        var s = subById(cat, id);
        if (s) items.push({ name: subName(s), notes: (e.subNotes || {})[id] || [] });
      });
    } else {
      cat.subs.forEach(function(s){
        if (e.subs.indexOf(s.id) !== -1) items.push({ name: subName(s), notes: cat.detail ? ((e.subNotes || {})[s.id] || []) : [] });
      });
    }
  }
  return { ranked: !!cat.ranked, detail: hasDetail(cat), items: items, subs: items.map(function(i){ return i.name; }),
    notes: e ? (e.notes || []).filter(function(n){ return !n.given; }) : [],
    archive: e ? (e.notes || []).filter(function(n){ return !!n.given; }) : [] };
}
function hasDetail(cat){ return !!(cat.ranked || cat.detail); }

function entryLine(e){

    return (e.ranked ? (i + 1) + ". " : "") + it.name + (it.notes.length ? " (" + noteTexts(it.notes).join("; ") + ")" : "");
  });

}

function editableEntry(person, catId){

}

/* Text zum Kopieren: eine Kategorie bzw. alle ausgefüllten Kategorien einer Person */
function noteLine(n){ return noteLabel(n) + (n.url ? " (" + n.url + ")" : ""); }
function categoryText(person, cat){
  var e = entryOf(person, cat);
  if (!e.subs.length && !e.notes.length) return "";
  var lines = [];
  if (e.detail) {
    lines.push(catName(cat) + ":");
    e.items.forEach(function(it, i){
      lines.push((e.ranked ? (i + 1) + ". " : "• ") + it.name);
      it.notes.forEach(function(n){ lines.push("   - " + noteLine(n)); });
    });
  } else {
    lines.push(catName(cat) + ":" + (e.subs.length ? " " + e.subs.join(", ") : ""));
  }
  e.notes.forEach(function(n){ lines.push("- " + noteLine(n)); });
  return lines.join("\n");
}

  visibleCats().forEach(function(c){ var t = categoryText(person, c); if (t) blocks.push(t); });
  var card = cardLines(person);
  if (!blocks.length && !card.length) return "";
  return displayName(person) + (card.length ? "\n" + card.join("\n") : "") + (blocks.length ? "\n\n" + blocks.join("\n\n") : "");

    document.body.appendChild(d); showDialog(d); ta.focus(); ta.select();
  }
  function legacy(){
    var ok = false;
    var ta = h("textarea", { value: text, readonly: true });
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta);
    try { ta.select(); ok = !!document.execCommand && document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();

  }
  if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
    navigator.clipboard.writeText(text).then(function(){ toast("Kopiert"); }, legacy);
  } else legacy();
}

/* Notizen als Punkte: Enter (oder +) legt einen Punkt an, ✕ entfernt ihn, Antippen öffnet Titel, Beschreibung und Link. */
/* Vorschläge für eine Kategorie (oder eine ihrer Unterkategorien): zuerst eigene frühere Einträge, dann die Wortliste */
function suggestionsFor(cat, sub){
  var out = [], seen = {};
  function push(t){ var k = t.toLowerCase(); if (!seen[k]) { seen[k] = 1; out.push(t); } }
  state.people.forEach(function(p){
    var e = p.entries[cat.id];
    if (!e) return;
    var notes = sub ? ((e.subNotes || {})[sub.id] || []) : (e.notes || []);
    notes.forEach(function(n){ push(n.title); });
  });
  var words = (sub && wordsFor("sub:" + sub.name.trim().toLowerCase())) || wordsFor(cat.kind) || [];
  words.forEach(push);
  return out;
}

var flushers = [];   // übernimmt angefangene Eingaben sofort, z. B. vor dem Kopieren oder Wechseln der Ansicht
function flushPending(){ flushers.slice().forEach(function(f){ f(); }); }

var archiveOpen = {};   // aufgeklappte Geschenkarchive, je Person und Kategorie
function today(){ return stamp(); }

/* gift: Schlüssel (Person + Kategorie), wenn Wünsche als geschenkt markiert und ins Archiv gelegt werden können; sonst leer */
function notesBlock(read, write, placeholder, label, suggest, gift){
  var list = h("ul", { class: "points" });
  var sugg = h("div", { class: "suggest", hidden: true });
  var words = null, blurTimer = null;
  function hideSuggest(){ sugg.textContent = ""; sugg.hidden = true; }
  function showSuggest(){
    sugg.textContent = "";
    var v = input.value, q = v.trim().toLowerCase();
    // nur solange der Titel getippt wird, ab zwei Buchstaben
    if (!suggest || !prefs.suggest || q.length < 2 || /:\s|\s[-–—]\s|:$|\/\//.test(v)) { sugg.hidden = true; return; }
    if (!words) words = suggest();
    var starts = [], inner = [];
    for (var i = 0; i < words.length && starts.length < 6; i++) {
      var l = words[i].toLowerCase();
      if (l === q) continue;
      if (l.indexOf(q) === 0) starts.push(words[i]);
      else if (inner.length < 6 && (l.indexOf(" " + q) !== -1 || l.indexOf("-" + q) !== -1)) inner.push(words[i]);
    }
    starts.concat(inner).slice(0, 6).forEach(function(w){
      sugg.appendChild(h("button", { class: "chip", type: "button", text: w, "aria-label": "Vorschlag " + w + " übernehmen",
        onmousedown: function(ev){ ev.preventDefault(); },   // Eingabefeld behält den Fokus
        onclick: function(){ clearTimeout(blurTimer); input.value = w; hideSuggest(); input.focus(); } }));
    });
    sugg.hidden = !sugg.firstChild;
  }
  var input = h("input", { class: "field", type: "text", placeholder: placeholder, "aria-label": label, autocomplete: "off", enterkeyhint: "done" });

  function makeItem(n){
    var li = h("li", { class: "point" });
    function fill(){
      li.textContent = "";
      var open = h("button", { class: "pointtext", type: "button", "aria-label": noteLabel(n) + " – Details ansehen und bearbeiten",
        onclick: function(){ editPoint(n, fill); } },
        h("span", { class: "pointtitle", text: n.title }));
      if (n.desc) open.appendChild(h("span", { class: "pointdesc", text: n.desc }));
      if (n.imgs && n.imgs.length) open.appendChild(h("span", { class: "pointmeta", text: n.imgs.length === 1 ? "1 Bild" : n.imgs.length + " Bilder" }));
      var body = h("div", { class: "pointbody" }, open);
      if (n.url) body.appendChild(h("a", { class: "pointlink", href: n.url, target: "_blank", rel: "noopener noreferrer", text: "Link öffnen" }));
      li.appendChild(body);
      if (gift) li.appendChild(h("button", { class: "btn icon", type: "button", icon: GIFT_ICON, "aria-label": "„" + n.title + "“ als geschenkt markieren", title: "Als geschenkt markieren",
        onclick: function(){ giftDialog(n, drawAll); } }));
      li.appendChild(h("button", { class: "btn icon danger", type: "button", text: "✕", "aria-label": "Notiz „" + n.title + "“ entfernen",
        onclick: function(){
          var a = write(), i = a.indexOf(n);
          if (i !== -1) a.splice(i, 1);
          saveNow(); li.remove();
        } }));
    }
    fill();
    return li;
  }
  // Archivierter Wunsch: gestrichelt, mit Anlass und Datum; lässt sich zurückholen
  function makeArchived(n){
    var open = h("button", { class: "pointtext", type: "button", "aria-label": noteLabel(n) + " – Details ansehen und bearbeiten",
      onclick: function(){ editPoint(n, drawAll); } },
      h("span", { class: "pointtitle", text: n.title }));
    if (n.desc) open.appendChild(h("span", { class: "pointdesc", text: n.desc }));
    open.appendChild(h("span", { class: "pointgiven", text: givenLabel(n) }));
    return h("li", { class: "point given" }, h("div", { class: "pointbody" }, open),
      h("button", { class: "btn icon", type: "button", icon: UNDO_ICON, "aria-label": "„" + n.title + "“ zurück zu den Wünschen", title: "Zurück zu den Wünschen",
        onclick: function(){ delete n.given; delete n.givenNote; delete n.givenAt; saveNow(); drawAll(); toast("Wieder bei den Wünschen"); } }),
      h("button", { class: "btn icon danger", type: "button", text: "✕", "aria-label": "„" + n.title + "“ aus dem Archiv löschen",
        onclick: function(){
          var a = write(), i = a.indexOf(n);
          if (i !== -1) a.splice(i, 1);
          saveNow(); drawAll();
        } }));
  }
  var archive = gift ? h("div", { class: "archive" }) : null;
  function drawAll(){
    list.textContent = "";
    read().forEach(function(n){ if (!n.given) list.appendChild(makeItem(n)); });
    if (!archive) return;
    archive.textContent = "";
    var items = read().filter(function(n){ return !!n.given; })
      .sort(function(a, b){ return String(b.givenAt || "").localeCompare(String(a.givenAt || "")); });
    if (!items.length) return;
    var open = !!archiveOpen[gift];
    archive.appendChild(h("button", { class: "btn quiet morebtn", type: "button", "aria-expanded": open ? "true" : "false",
      text: (open ? "▾ " : "▸ ") + "Geschenkarchiv (" + items.length + ")",
      onclick: function(){ archiveOpen[gift] = !open; drawAll(); } }));
    if (!open) return;
    var ul = h("ul", { class: "points" });
    items.forEach(function(n){ ul.appendChild(makeArchived(n)); });
    archive.appendChild(ul);
  }
  function commit(){
    var pt = parsePoint(input.value);
    if (!pt.title) return;
    var n = { id: uid(), title: pt.title, desc: pt.desc, url: pt.url, imgs: [] };
    write().push(n);
    input.value = "";
    hideSuggest();
    words = null;
    saveNow();
    list.appendChild(makeItem(n));
  }
  // Angefangenes geht nicht verloren: kurz warten, falls gerade ein Vorschlag angetippt wird
  input.addEventListener("blur", function(){
    clearTimeout(blurTimer);
    blurTimer = setTimeout(function(){ if (document.activeElement !== input) commit(); }, 250);
  });
  input.addEventListener("focus", function(){ clearTimeout(blurTimer); words = null; });
  input.addEventListener("input", showSuggest);
  flushers.push(function(){ clearTimeout(blurTimer); commit(); });
  drawAll();

  return h("div", null, list, sugg,
    h("form", { class: "row", onsubmit: function(ev){ ev.preventDefault(); commit(); input.focus(); } },
      input, h("button", { class: "btn icon", type: "submit", text: "+", "aria-label": "Notiz hinzufügen" })),
    archive);
}

/* ---------- Bilder zu Notizen ----------
   Die Bilder liegen getrennt in der Browser-Datenbank (IndexedDB), damit der Platz reicht.
   An der Notiz steht nur ein Verweis; Backup und Personen-Datei nehmen die Bilder mit. */
var imgDbP = null, gcHold = 0, gcTimer = null;
function imgDb(){
  if (!imgDbP) imgDbP = new Promise(function(resolve, reject){
    var req;
    try { req = indexedDB.open("merkbuch-bilder", 1); } catch (e) { reject(e); return; }
    req.onupgradeneeded = function(){ req.result.createObjectStore("img"); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
  return imgDbP;
}
function imgStore(mode, work){
  return imgDb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction("img", mode), req = work(tx.objectStore("img"));
      tx.oncomplete = function(){ resolve(req ? req.result : undefined); };
      tx.onerror = tx.onabort = function(){ reject(tx.error); };
    });
  });
}
function imgPut(id, data){ return imgStore("readwrite", function(st){ return st.put(data, id); }); }
function imgGet(id){ return imgStore("readonly", function(st){ return st.get(id); }); }
function validImage(v){ return typeof v === "string" && v.length < 1500000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(v); }

function imageIds(people){
  var ids = [], seen = {};
  function take(notes){ (notes || []).forEach(function(n){ (n.imgs || []).forEach(function(id){ if (!seen[id]) { seen[id] = 1; ids.push(id); } }); }); }
  people.forEach(function(p){
    Object.keys(p.entries || {}).forEach(function(k){
      var e = p.entries[k];
      take(e.notes);
      Object.keys(e.subNotes || {}).forEach(function(sk){ take(e.subNotes[sk]); });
    });
  });
  return ids;
}
/* Bilder für eine Datei einsammeln bzw. aus einer Datei übernehmen; beides scheitert nie */
function collectImages(ids){
  return Promise.all(ids.map(function(id){
    return imgGet(id).then(function(d){ return [id, d]; }, function(){ return [id, null]; });
  })).then(function(pairs){
    var out = {};
    pairs.forEach(function(x){ if (validImage(x[1])) out[x[0]] = x[1]; });
    return out;
  }, function(){ return {}; });
}
function storeImages(map){
  if (!map || typeof map !== "object") return Promise.resolve();
  return Promise.all(Object.keys(map).filter(function(id){ return validImage(map[id]); }).map(function(id){
    return imgPut(id, map[id]).catch(function(){});
  })).then(function(){}, function(){});
}
/* Räumt Bilder weg, auf die keine Notiz mehr verweist */
function scheduleGc(){ clearTimeout(gcTimer); gcTimer = setTimeout(gcImages, 3000); }
function gcImages(){
  if (!storageOk) return;
  if (gcHold > 0) { scheduleGc(); return; }
  var used = {};
  imageIds(state.people).forEach(function(id){ used[id] = 1; });
  imgStore("readwrite", function(st){
    var r = st.getAllKeys();
    r.onsuccess = function(){ if (gcHold > 0) return; r.result.forEach(function(k){ if (!used[k]) st.delete(k); }); };
    return null;
  }).catch(function(){});
}

/* Verkleinert ein Bild auf höchstens 1000 Pixel Kantenlänge */
function shrinkImage(file){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      try {
        var k = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
        var canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.naturalWidth * k));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * k));
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        var data = canvas.toDataURL("image/jpeg", 0.78);
        URL.revokeObjectURL(url);
        if (validImage(data)) resolve(data); else reject(new Error("Bild"));
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("Bild")); };
    img.src = url;
  });
}
function showImage(src, alt){
  var d = h("dialog", { class: "viewer" }, h("img", { src: src, alt: alt }),
    h("div", { class: "row" }, h("button", { class: "btn primary", type: "button", text: "Schließen", onclick: function(){ d.remove(); } })));
  d.addEventListener("close", function(){ d.remove(); });

      h("button", { class: "btn primary", type: "submit", text: "Speichern" }))));

/* ---------- PIN-Sperre ----------
   Eine Bildschirmsperre für die App: Ohne PIN wird nichts angezeigt. Die gespeicherten Daten und Backup-Dateien
   sind dadurch nicht verschlüsselt. Gespeichert wird nur ein Prüfwert der PIN, nicht die PIN selbst. */
var LOCK_KEY = "merkbuch.lock";
var RESET_HOURS = 24;   // Wartezeit beim Zurücksetzen mit Wartezeit
/* Erlaubte Wege, eine vergessene PIN zurückzusetzen. Alles ist zunächst aus; Code und Antwort liegen nur als Prüfwert vor. */
function cleanRec(r){
  r = r && typeof r === "object" ? r : {};
  function hashed(x){ return x && x.salt && x.hash ? { salt: String(x.salt), hash: String(x.hash) } : null; }
  var q = hashed(r.question);
  if (q) q.q = String(r.question.q || "").slice(0, 200);
  return {
    code: hashed(r.code),
    question: q && q.q ? q : null,
    bio: r.bio && r.bio.id ? { id: String(r.bio.id) } : null,          // Entsperren mit Fingerabdruck oder Gesicht
    bioReset: !!(r.bioReset && r.bio && r.bio.id),                     // damit auch die PIN zurücksetzen dürfen
    delay: !!r.delay,
    delayUntil: Number(r.delayUntil) || 0
  };
}
var lock = null;
try {
  var savedLock = JSON.parse(localStorage.getItem(LOCK_KEY) || "null");
  if (savedLock && savedLock.hash && savedLock.salt) {
    lock = { salt: String(savedLock.salt), hash: String(savedLock.hash), auto: [0, 1, 5].indexOf(Number(savedLock.auto)) !== -1 ? Number(savedLock.auto) : 1,
      rec: cleanRec(savedLock.rec) };
  }
} catch (e) {}
var locked = !!lock, wrongTries = 0, blockedUntil = 0, hiddenAt = 0;
try { blockedUntil = Number(localStorage.getItem("merkbuch.lockwait")) || 0; } catch (e) {}   // Wartezeit übersteht ein Neuladen
function saveLock(){
  try { if (lock) localStorage.setItem(LOCK_KEY, JSON.stringify(lock)); else localStorage.removeItem(LOCK_KEY); } catch (e) {}
}
function pinHash(pin, salt){
  var text = salt + ":" + pin;
  if (window.crypto && window.crypto.subtle && window.TextEncoder) {
    return window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function(buf){
      return "s:" + Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0" + b.toString(16)).slice(-2); }).join("");
    });
  }
  var a = 5381, b = 52711;   // Ausweichlösung ohne Krypto-Schnittstelle
  for (var i = 0; i < text.length; i++) { var ch = text.charCodeAt(i); a = (a * 33) ^ ch; b = (b * 33) ^ ch; }
  return Promise.resolve("f:" + (a >>> 0).toString(16) + (b >>> 0).toString(16));
}
function setPin(pin){
  var salt = "";
  try { var r = new Uint8Array(12); window.crypto.getRandomValues(r); salt = Array.prototype.map.call(r, function(x){ return x.toString(16); }).join(""); }
  catch (e) { salt = String(Math.random()).slice(2) + Date.now().toString(16); }
  return pinHash(pin, salt).then(function(hash){
    lock = { salt: salt, hash: hash, auto: lock ? lock.auto : 1, rec: lock ? lock.rec : cleanRec(null) };
    saveLock();
  });
}
function checkPin(pin){
  if (!lock) return Promise.resolve(true);
  return pinHash(pin, lock.salt).then(function(hash){ return hash === lock.hash; }, function(){ return false; });
}
function validPin(pin){ return /^\d{4,12}$/.test(pin); }
function doLock(){
  if (!lock || locked) return;
  flushPending();
  if (saveTimer) saveNow();
  Array.prototype.forEach.call(document.querySelectorAll("dialog"), function(d){
    if (d.id === "dlg") { if (d.open) d.close(); } else d.remove();
  });
  locked = true; recovered = false; bioTried = false;
  render();
  window.scrollTo(0, 0);
}
document.addEventListener("visibilitychange", function(){
  if (!lock || locked) return;
  if (document.hidden) { hiddenAt = Date.now(); if (lock.auto === 0) doLock(); }
  else if (hiddenAt && Date.now() - hiddenAt >= lock.auto * 60000) doLock();
});
function whenText(t){
  var d = new Date(t);
  return d.toLocaleDateString("de-DE") + ", " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) + " Uhr";
}
/* Zählt Fehlversuche (PIN, Code, Antwort gemeinsam) und verhängt nach fünf eine Wartezeit */
function failedTry(message){
  wrongTries++;
  if (wrongTries >= 5) {
    wrongTries = 0; blockedUntil = Date.now() + 30000;
    try { localStorage.setItem("merkbuch.lockwait", String(blockedUntil)); } catch (e) {}

    lock.rec.bio && bioSupported() ? h("button", { class: "btn", type: "button", text: "Mit Fingerabdruck oder Gesicht entsperren", onclick: function(){

/* Auswahl über +: jede gewählte Unterkategorie bekommt eigene Notizen; mit Rangfolge zusätzlich Platznummer und Pfeile */
function rankedBlock(p, c){
  var box = h("div");
  function draw(){
    box.textContent = "";
    var e = p.entries[c.id];
    if (e) e.subs = e.subs.filter(function(id){ return !!subById(c, id); });
    var chosen = !e ? [] : c.ranked ? e.subs.map(function(id){ return subById(c, id); })
      : c.subs.filter(function(s){ return e.subs.indexOf(s.id) !== -1; });

    chosen.forEach(function(s, i){
      var note = notesBlock(
        function(){ var en = p.entries[c.id]; return en && en.subNotes && en.subNotes[s.id] ? en.subNotes[s.id] : []; },
        function(){ var en = editableEntry(p, c.id); if (!en.subNotes[s.id]) en.subNotes[s.id] = []; return en.subNotes[s.id]; },
        "Titel: Beschreibung", "Neue Notiz zu " + subName(s),
        function(){ return suggestionsFor(c, s); });
      box.appendChild(h("div", { class: "rank" },
        h("div", { class: "rankhead" },
          c.ranked ? h("span", { class: "ranknum", text: String(i + 1), "aria-label": "Platz " + (i + 1) }) : null,
          h("span", { class: "rankname", text: subName(s) }),
          c.ranked ? h("button", { class: "btn icon", text: "↑", "aria-label": subName(s) + " einen Platz nach oben", disabled: i === 0,
            onclick: function(){ shift(i, -1); } }) : null,
          c.ranked ? h("button", { class: "btn icon", text: "↓", "aria-label": subName(s) + " einen Platz nach unten", disabled: i === chosen.length - 1,
            onclick: function(){ shift(i, 1); } }) : null,
          h("button", { class: "btn icon danger", text: "✕", "aria-label": subName(s) + " abwählen",
            onclick: function(){
              var en = editableEntry(p, c.id), at = en.subs.indexOf(s.id);
              if (at !== -1) en.subs.splice(at, 1);
              saveNow(); draw();
            } })
        ),
        note));
    });

    var rest = c.subs.filter(function(s){ return chosen.indexOf(s) === -1; });
    if (chosen.length === 0) box.appendChild(h("p", { class: "muted small", text: c.ranked ? "Tippe an, was passt. Die Reihenfolge ist die Rangfolge, Platz 1 steht oben." : "Tippe an, was passt." }));
    if (rest.length) {
      var chips = h("div", { class: "chips" });
      rest.forEach(function(s){
        chips.appendChild(h("button", { class: "chip", text: "+ " + subName(s), "aria-label": subName(s) + " auswählen",
          onclick: function(){ editableEntry(p, c.id).subs.push(s.id); saveNow(); draw(); } }));
      });
      box.appendChild(chips);
    }
  }
  function shift(i, dir){
    var a = editableEntry(p, c.id).subs, j = i + dir;
    if (j < 0 || j >= a.length) return;
    var t = a[i]; a[i] = a[j]; a[j] = t;
    saveNow(); draw();
  }
  draw();
  return box;
}

/* Notizen nur zum Lesen, Links anklickbar */
function readPoints(notes){
  var ul = h("ul", { class: "readpoints" });
  notes.forEach(function(n){
    var li = h("li", null, h("b", { text: n.title }));
    if (n.desc) li.appendChild(h("span", { class: "readdesc", text: n.desc }));
    if (n.url) li.appendChild(h("a", { href: n.url, target: "_blank", rel: "noopener noreferrer", text: "Link öffnen" }));
    ul.appendChild(li);
  });
  return ul;
}

/* ---------- Vergleichen ---------- */
/* Was eine Person in einer Kategorie eingetragen hat, zum Lesen */
function entryView(p, cat){
  var e = entryOf(p, cat), box = h("div");
  if (e.detail && e.items.length) {
    var ol = h(e.ranked ? "ol" : "ul", { class: "ranklist" });
    e.items.forEach(function(it){
      var li = h("li", null, h("b", { text: it.name }));
      if (it.notes.length) li.appendChild(readPoints(it.notes));
      ol.appendChild(li);
    });
    box.appendChild(ol);
  } else if (e.subs.length) {
    var tags = h("div");
    e.subs.forEach(function(s){ tags.appendChild(h("span", { class: "tag", text: s })); });
    box.appendChild(tags);
  }
  if (e.notes.length) box.appendChild(readPoints(e.notes));
  if (!e.subs.length && !e.notes.length) box.appendChild(h("div", { class: "muted", text: e.archive.length ? "Keine offenen Wünsche" : "Noch nichts eingetragen" }));
  if (e.archive.length) box.appendChild(h("div", { class: "muted small", text: e.archive.length + " im Geschenkarchiv" }));
  return box;
}

/* Auswahl per Antippen. shown() liefert, was gerade zu sehen ist.
   „Alle auswählen“ wählt das Sichtbare, „Keine auswählen“ leert die ganze Auswahl. */
function chipGroup(all, shown, label, isOn, setOn, changed, more){
  var chips = h("div", { class: "chips" });
  function draw(){
    chips.textContent = "";
    var items = shown();
    items.forEach(function(it){
      var chip = h("button", { class: "chip", "aria-pressed": isOn(it) ? "true" : "false", text: label(it),
        onclick: function(){
          setOn(it, !isOn(it));
          chip.setAttribute("aria-pressed", isOn(it) ? "true" : "false");
          changed();
        } });
      chips.appendChild(chip);
    });
    if (!items.length) chips.appendChild(h("span", { class: "muted small chipnote", text: "Kein Treffer" }));
    // weitere Einträge über einen kleinen Knopf am Ende: „+12“ zeigt alle, „−“ klappt wieder ein
    if (more && (more.isOpen() || more.rest() > 0)) {
      var open = more.isOpen();
      chips.appendChild(h("button", { class: "chip morechip", type: "button", text: open ? "−" : "+" + more.rest(),
        "aria-label": open ? "Weniger anzeigen" : more.rest() + " weitere anzeigen", title: open ? "Weniger anzeigen" : "Alle anzeigen",
        onclick: function(){ more.toggle(); draw(); } }));
    }
  }
  draw();
  var node = h("div", null, chips, h("div", { class: "row" },
    h("button", { class: "btn", text: "Alle auswählen", onclick: function(){ shown().forEach(function(it){ setOn(it, true); }); draw(); changed(); } }),
    h("button", { class: "btn", text: "Keine auswählen", onclick: function(){ all.forEach(function(it){ setOn(it, false); }); draw(); changed(); } })));
  return { node: node, draw: draw };
}

/* Diese Kategorien stehen im Vergleich von Anfang an zur Auswahl, in dieser Reihenfolge; alle anderen kommen über das + */
var COMPARE_FIRST = ["ernaehrung", "mag", "magnicht", "allergien", "suess", "kuchen", "pizza"];

/* Die Kategorien, die im Vergleich von Anfang an zur Auswahl stehen: selbst festgelegt oder die Vorgabe */
function compareFirstCats(allCats){
  var out = [];
  if (prefs.cmpCats) {
    prefs.cmpCats.forEach(function(id){
      var c = allCats.filter(function(x){ return x.id === id; })[0];
      if (c && out.indexOf(c) === -1) out.push(c);
    });
  } else {
    COMPARE_FIRST.forEach(function(kind){
      var c = allCats.filter(function(x){ return x.kind === kind; })[0];
      if (c) out.push(c);
    });
  }
  return out;
}

function renderCompare(){
  app.appendChild(h("h1", { text: "Vergleichen" }));
  if (state.people.length === 0 || state.categories.length === 0) {
    app.appendChild(h("div", { class: "empty", text: state.people.length === 0
      ? "Lege zuerst unter „Personen“ jemanden an."
      : "Es gibt keine Kategorien. Lege unter Einstellungen welche an." }));
    return;
  }
  var allCats = visibleCats();
  if (!allCats.length) { app.appendChild(h("div", { class: "empty", text: "Alle Kategorien sind ausgeblendet. Blende unter Einstellungen welche ein." })); return; }
  var first = compareFirstCats(allCats);
  if (!first.length) first = allCats.slice(0, 6);   // falls keine davon (mehr) vorhanden ist
  var cats = first.concat(allCats.filter(function(c){ return first.indexOf(c) === -1; }));
  var TOP = first.length, top = { first: first[0].id };
  first.forEach(function(c){ top[c.id] = true; });
  if (!cats.some(function(c){ return compareOn[c.id]; })) {
    compareOn = {};
    compareOn[top.first] = true;
  }
  var people = state.people.slice().sort(byName);
  var results = h("div");

  // Kategorien: zuerst nur die häufigsten, der Rest über das + am Ende. Ausgewählte bleiben immer sichtbar.
  function shownCats(){ return compareAllCats ? cats : cats.filter(function(c){ return top[c.id] || compareOn[c.id]; }); }
  var catGroup = chipGroup(cats, shownCats, catName,
    function(c){ return !!compareOn[c.id]; },
    function(c, on){ if (on) compareOn[c.id] = true; else delete compareOn[c.id]; },
    fillResults,
    { isOpen: function(){ return compareAllCats && cats.length > TOP; },
      rest: function(){ return cats.length - shownCats().length; },
      toggle: function(){ compareAllCats = !compareAllCats; } });
  app.appendChild(h("h2", { text: "Kategorien" })).style.marginTop = "0";
  app.appendChild(catGroup.node);

  // Personen: zuerst nur die zuletzt geöffneten oder bearbeiteten (höchstens fünf, bei langen Namen weniger), der Rest über das +.
  // Ausgewählte bleiben immer sichtbar; die Suche zeigt alle Treffer.
  var recent = [], width = 0;
  function lastUsed(p){ return Math.max(p.seen || 0, p.updated || 0); }
  people.slice().sort(function(a, b){ return lastUsed(b) - lastUsed(a) || byName(a, b); }).some(function(p){
    var w = displayName(p).length + 6;                 // grobe Breite eines Namens samt Rand und Haken
    if (recent.length && (recent.length >= prefs.cmpPeople || width + w > 15 * prefs.cmpPeople)) return true;
    recent.push(p); width += w;
    return false;
  });
  // Solange niemand von Hand ausgewählt wurde, sind genau die zuletzt geöffneten ausgewählt
  if (!comparePeopleSet || !people.some(function(p){ return comparePeople[p.id]; })) {
    comparePeopleSet = false;
    comparePeople = {};
    recent.forEach(function(p){ comparePeople[p.id] = true; });
  }
  function personQuery(){ return comparePersonQuery.trim().toLowerCase(); }
  function shownPeople(){
    var q = personQuery();
    if (q) return people.filter(function(p){ return displayName(p).toLowerCase().indexOf(q) !== -1; });
    if (compareAllPeople) return people;
    return recent.concat(people.filter(function(p){ return recent.indexOf(p) === -1 && comparePeople[p.id]; }));
  }
  var personGroup = chipGroup(people, shownPeople, displayName,
    function(p){ return !!comparePeople[p.id]; },
    function(p, on){ comparePeopleSet = true; if (on) comparePeople[p.id] = true; else delete comparePeople[p.id]; },
    fillResults,
    { isOpen: function(){ return compareAllPeople && !personQuery() && people.length > recent.length; },
      rest: function(){ return personQuery() ? 0 : people.length - shownPeople().length; },
      toggle: function(){ compareAllPeople = !compareAllPeople; } });
  var personSearch = h("input", { class: "field cmpsearch", type: "search", placeholder: "Person suchen", "aria-label": "Person suchen", value: comparePersonQuery,
    oninput: function(){ comparePersonQuery = personSearch.value; personGroup.draw(); } });
  app.appendChild(h("h2", { text: "Personen" }));
  app.appendChild(personSearch);
  app.appendChild(personGroup.node);

  app.appendChild(h("h2", { text: "Darstellung" }));
  var modes = [["cols", "Personen als Spalten"], ["rows", "Personen als Zeilen"]], modeNodes = [];
  var modeChips = h("div", { class: "chips" });
  modes.forEach(function(m){
    var chip = h("button", { class: "chip", "aria-pressed": compareMode === m[0] ? "true" : "false", text: m[1],
      onclick: function(){
        compareMode = m[0];
        try { localStorage.setItem("merkbuch.compare", compareMode); } catch (e) {}
        modeNodes.forEach(function(x){ x.node.setAttribute("aria-pressed", x.mode === compareMode ? "true" : "false"); });
        fillResults();
      } });
    modeNodes.push({ mode: m[0], node: chip });
    modeChips.appendChild(chip);
  });
  app.appendChild(modeChips);
  app.appendChild(results);

  function fillResults(){
    results.textContent = "";
    var chosenCats = cats.filter(function(c){ return compareOn[c.id]; });
    var chosenPeople = people.filter(function(p){ return comparePeople[p.id]; });
    if (!chosenCats.length || !chosenPeople.length) {
      results.appendChild(h("p", { class: "empty", text: !chosenCats.length ? "Wähle oben mindestens eine Kategorie aus." : "Wähle oben mindestens eine Person aus." }));
      return;
    }
    // Spalten: je Kategorie ein Block mit den Personen nebeneinander. Zeilen: je Person ein Block mit den Kategorien nebeneinander.
    var byCols = compareMode === "cols";
    var outer = byCols ? chosenCats : chosenPeople, inner = byCols ? chosenPeople : chosenCats;
    if (inner.length >= 3) results.appendChild(h("p", { class: "muted small", text:
      "Seitlich wischen, um weitere " + (byCols ? "Personen" : "Kategorien") + " zu sehen." })).style.margin = "14px 0 0";
    outer.forEach(function(o){
      results.appendChild(h("h3", { class: "cmphead", text: byCols ? catName(o) : displayName(o) }));
      var block = h("div", { class: "card cols", tabindex: "0", "aria-label": (byCols ? catName(o) : displayName(o)) + ": Vergleich" });
      inner.forEach(function(i){
        var p = byCols ? i : o, c = byCols ? o : i;
        block.appendChild(h("div", { class: "result" }, h("div", { class: "who", text: byCols ? displayName(p) : catName(c) }), entryView(p, c)));
      });
      results.appendChild(block);
    });
  }
  fillResults();
}

/* Backup über das Teilen-Menü des Handys weitergeben, z. B. an Google Drive */
function canShareFiles(){ return !!(navigator.share && navigator.canShare && window.File); }
function shareBackup(){
  flushPending();
  if (saveTimer) saveNow();
  collectImages(imageIds(state.people)).then(function(images){
    var json = JSON.stringify({ version: state.version, categories: state.categories, people: state.people, images: images }, null, 2);
    var name = "merkbuch-backup-" + stamp();
    var files = [new File([json], name + ".json", { type: "application/json" }), new File([json], name + ".txt", { type: "text/plain" })];
    var file = files.filter(function(f){ try { return navigator.canShare({ files: [f] }); } catch (e) { return false; } })[0];

    }, function(err){

function writeBackup(json){
  var d = new Date();
  var stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  var filename = "merkbuch-backup-" + stamp + ".json";
  function fallback(){ fallbackJson = json; if (view === "settings") { render(); window.scrollTo(0, document.body.scrollHeight); } }

  var useP = (window.claude && typeof window.claude.use === "function") ? window.claude.use("downloads") : Promise.resolve(null);
  useP.then(function(downloads){
    if (!downloads) {
      if (STANDALONE && browserDownload(filename, json)) { fallbackJson = null; markBackup(); toast("Backup gespeichert, es liegt bei deinen Downloads"); if (view === "settings") render(); }
      else fallback();
      return;
    }
    return downloads.save({ filename: filename, data: json }).then(function(){
      fallbackJson = null; markBackup(); toast("Backup gespeichert"); if (view === "settings") render();
    }, function(err){
      var code = err && err.code;
      if (code === "declined") return;
      if (code === "rate_limited") { toast("Bitte kurz warten und noch einmal versuchen"); return; }
      fallback();
    });
  }).catch(fallback);
}

function stamp(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
